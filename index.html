<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isometric Build-Em-Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: system-ui, sans-serif;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        #instructions {
            color: #eee;
            text-align: center;
            font-size: 14px;
        }
        #instructions kbd {
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #555;
        }
        canvas {
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="instructions">
            <kbd>Q W E</kbd><br>
            <kbd>A</kbd>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<kbd>D</kbd> Tap: Face / Hold: Move &nbsp;&nbsp;
            <kbd>Space</kbd> Use Skill &nbsp;&nbsp;
            <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> Select Skill &nbsp;&nbsp;
            <kbd>T</kbd> Board/Exit Train &nbsp;&nbsp;
            <button id="generate-city" onclick="generateCity(); this.blur(); document.querySelector('canvas').focus();">Generate City</button><br>
            <kbd>Z X C</kbd>
        </div>
    </div>
    <script src="https://unpkg.com/kaplay@3001/dist/kaplay.js"></script>
    <script>
        // Initialize Kaplay
        const k = kaplay({
            width: 800,
            height: 600,
            background: [40, 44, 52],
            global: false,
        });

        // Make canvas focusable for keyboard input
        const canvas = document.querySelector('canvas');
        if (canvas) {
            canvas.tabIndex = 0;
            canvas.focus();
        }

        // Canvas dimensions
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;

        // Base isometric settings (at zoom 1.0)
        const BASE_TILE_WIDTH = 64;
        const BASE_TILE_HEIGHT = 32;
        const BASE_CUBE_HEIGHT = 24;

        // Grid settings
        const GRID_INCREMENT = 5;
        const MIN_GRID_SIZE = 10;
        const MAX_ZOOM_GRID = 30;  // After this size, start scrolling instead of zooming
        const MIN_ZOOM = 0.4;      // Minimum zoom level

        // Dynamic game state
        const gameState = {
            gridSize: MIN_GRID_SIZE,
            zoom: 1.0,
            cameraX: 0,  // Camera offset for scrolling
            cameraY: 0,
            scrolling: false,  // Whether we're in scroll mode
        };

        // Calculate zoom and camera based on grid size
        function updateZoomAndCamera() {
            if (gameState.gridSize <= MAX_ZOOM_GRID) {
                // Zoom mode: scale down to fit grid
                gameState.zoom = Math.max(MIN_ZOOM, MIN_GRID_SIZE / gameState.gridSize);
                gameState.scrolling = false;
                gameState.cameraX = 0;
                gameState.cameraY = 0;
            } else {
                // Scroll mode: fixed zoom, camera follows player
                gameState.zoom = MIN_ZOOM;
                gameState.scrolling = true;
            }
        }

        // Get current tile dimensions based on zoom
        function getTileWidth() { return BASE_TILE_WIDTH * gameState.zoom; }
        function getTileHeight() { return BASE_TILE_HEIGHT * gameState.zoom; }
        function getCubeHeight() { return BASE_CUBE_HEIGHT * gameState.zoom; }

        // Game state - cube heights (dynamic 2D array)
        let cubeHeights = [];
        function initCubeHeights() {
            cubeHeights = [];
            for (let i = 0; i < gameState.gridSize; i++) {
                cubeHeights[i] = [];
                for (let j = 0; j < gameState.gridSize; j++) {
                    cubeHeights[i][j] = 0;
                }
            }
        }
        initCubeHeights();

        // City generation constants
        const CITY_SIZE = 100;

        // Structure generators - each takes position and places cubes
        const structures = {
            // Simple house: solid block with peaked roof
            house: (startX, startY) => {
                const width = 3 + Math.floor(Math.random() * 3);  // 3-5
                const depth = 3 + Math.floor(Math.random() * 3);  // 3-5
                const height = 2 + Math.floor(Math.random() * 3); // 2-4

                for (let x = 0; x < width; x++) {
                    for (let y = 0; y < depth; y++) {
                        const gx = startX + x;
                        const gy = startY + y;
                        if (gx < CITY_SIZE && gy < CITY_SIZE) {
                            cubeHeights[gx][gy] = Math.max(cubeHeights[gx][gy], height);
                        }
                    }
                }
            },

            // Tower: tall narrow structure
            tower: (startX, startY) => {
                const size = 2 + Math.floor(Math.random() * 2);   // 2-3
                const height = 5 + Math.floor(Math.random() * 6); // 5-10

                for (let x = 0; x < size; x++) {
                    for (let y = 0; y < size; y++) {
                        const gx = startX + x;
                        const gy = startY + y;
                        if (gx < CITY_SIZE && gy < CITY_SIZE) {
                            cubeHeights[gx][gy] = Math.max(cubeHeights[gx][gy], height);
                        }
                    }
                }
            },

            // Pyramid: stepped structure
            pyramid: (startX, startY) => {
                const baseSize = 4 + Math.floor(Math.random() * 4); // 4-7
                const maxHeight = Math.floor(baseSize / 2) + 1;

                for (let h = 0; h < maxHeight; h++) {
                    const offset = h;
                    const currentSize = baseSize - h * 2;
                    if (currentSize <= 0) break;

                    for (let x = 0; x < currentSize; x++) {
                        for (let y = 0; y < currentSize; y++) {
                            const gx = startX + offset + x;
                            const gy = startY + offset + y;
                            if (gx < CITY_SIZE && gy < CITY_SIZE) {
                                cubeHeights[gx][gy] = Math.max(cubeHeights[gx][gy], h + 1);
                            }
                        }
                    }
                }
            },

            // Stairs: walkable ramp structure
            stairs: (startX, startY) => {
                const length = 4 + Math.floor(Math.random() * 5); // 4-8
                const width = 2 + Math.floor(Math.random() * 2);  // 2-3
                const direction = Math.floor(Math.random() * 4);  // 0-3 for 4 directions

                for (let i = 0; i < length; i++) {
                    for (let w = 0; w < width; w++) {
                        let gx, gy;
                        if (direction === 0) { gx = startX + i; gy = startY + w; }
                        else if (direction === 1) { gx = startX + w; gy = startY + i; }
                        else if (direction === 2) { gx = startX + (length - 1 - i); gy = startY + w; }
                        else { gx = startX + w; gy = startY + (length - 1 - i); }

                        if (gx >= 0 && gx < CITY_SIZE && gy >= 0 && gy < CITY_SIZE) {
                            cubeHeights[gx][gy] = Math.max(cubeHeights[gx][gy], i + 1);
                        }
                    }
                }
            },

            // L-shaped building
            lBuilding: (startX, startY) => {
                const height = 2 + Math.floor(Math.random() * 3);
                const armLength = 4 + Math.floor(Math.random() * 3);
                const armWidth = 2;

                // Horizontal arm
                for (let x = 0; x < armLength; x++) {
                    for (let y = 0; y < armWidth; y++) {
                        const gx = startX + x;
                        const gy = startY + y;
                        if (gx < CITY_SIZE && gy < CITY_SIZE) {
                            cubeHeights[gx][gy] = Math.max(cubeHeights[gx][gy], height);
                        }
                    }
                }
                // Vertical arm
                for (let x = 0; x < armWidth; x++) {
                    for (let y = 0; y < armLength; y++) {
                        const gx = startX + x;
                        const gy = startY + y;
                        if (gx < CITY_SIZE && gy < CITY_SIZE) {
                            cubeHeights[gx][gy] = Math.max(cubeHeights[gx][gy], height);
                        }
                    }
                }
            },

            // Platform with ramp access
            platform: (startX, startY) => {
                const size = 5 + Math.floor(Math.random() * 3);  // 5-7
                const height = 2 + Math.floor(Math.random() * 2); // 2-3

                // Main platform
                for (let x = 0; x < size; x++) {
                    for (let y = 0; y < size; y++) {
                        const gx = startX + x;
                        const gy = startY + y;
                        if (gx < CITY_SIZE && gy < CITY_SIZE) {
                            cubeHeights[gx][gy] = Math.max(cubeHeights[gx][gy], height);
                        }
                    }
                }

                // Ramp on one side
                for (let i = 0; i < height; i++) {
                    const gx = startX + size + i;
                    for (let y = 0; y < 2; y++) {
                        const gy = startY + Math.floor(size / 2) - 1 + y;
                        if (gx < CITY_SIZE && gy < CITY_SIZE && gy >= 0) {
                            cubeHeights[gx][gy] = Math.max(cubeHeights[gx][gy], height - i);
                        }
                    }
                }
            },

            // Random scatter of single cubes (debris/decoration)
            scatter: (startX, startY) => {
                const area = 6 + Math.floor(Math.random() * 4);
                const count = 3 + Math.floor(Math.random() * 5);

                for (let i = 0; i < count; i++) {
                    const gx = startX + Math.floor(Math.random() * area);
                    const gy = startY + Math.floor(Math.random() * area);
                    const h = 1 + Math.floor(Math.random() * 2);
                    if (gx < CITY_SIZE && gy < CITY_SIZE) {
                        cubeHeights[gx][gy] = Math.max(cubeHeights[gx][gy], h);
                    }
                }
            },

            // Wall segment
            wall: (startX, startY) => {
                const length = 6 + Math.floor(Math.random() * 8);
                const height = 2 + Math.floor(Math.random() * 2);
                const horizontal = Math.random() > 0.5;

                for (let i = 0; i < length; i++) {
                    const gx = horizontal ? startX + i : startX;
                    const gy = horizontal ? startY : startY + i;
                    if (gx < CITY_SIZE && gy < CITY_SIZE) {
                        cubeHeights[gx][gy] = Math.max(cubeHeights[gx][gy], height);
                    }
                }
            },
        };

        // Generate a full city
        function generateCity() {
            // Reset grid to city size
            gridDimensions.width = CITY_SIZE;
            gridDimensions.height = CITY_SIZE;
            gameState.gridSize = CITY_SIZE;

            // Initialize empty grid
            cubeHeights = [];
            for (let i = 0; i < CITY_SIZE; i++) {
                cubeHeights[i] = [];
                for (let j = 0; j < CITY_SIZE; j++) {
                    cubeHeights[i][j] = 0;
                }
            }

            // Place random structures
            const structureTypes = Object.keys(structures);
            const numStructures = 80 + Math.floor(Math.random() * 40); // 80-120 structures

            for (let i = 0; i < numStructures; i++) {
                const type = structureTypes[Math.floor(Math.random() * structureTypes.length)];
                const x = Math.floor(Math.random() * (CITY_SIZE - 10));
                const y = Math.floor(Math.random() * (CITY_SIZE - 10));
                structures[type](x, y);
            }

            // Reset player to center
            player.x = Math.floor(CITY_SIZE / 2);
            player.y = Math.floor(CITY_SIZE / 2);
            player.facing = { x: -1, y: -1 };

            // Clear area around player spawn
            for (let x = -2; x <= 2; x++) {
                for (let y = -2; y <= 2; y++) {
                    const gx = player.x + x;
                    const gy = player.y + y;
                    if (gx >= 0 && gx < CITY_SIZE && gy >= 0 && gy < CITY_SIZE) {
                        cubeHeights[gx][gy] = 0;
                    }
                }
            }

            // Update zoom and camera
            updateZoomAndCamera();

            // Generate train track around city
            generateTrack(CITY_SIZE);

            // Clear and spawn treasures in the city
            treasures.clear();
            if (window.treasureHouses) window.treasureHouses.clear();
            housesCollected = 0;
            for (let i = 0; i < 20; i++) {
                const x = Math.floor(Math.random() * CITY_SIZE);
                const y = Math.floor(Math.random() * CITY_SIZE);
                // Only spawn on empty ground and not on track
                if (cubeHeights[x][y] === 0 && !isTrack(x, y)) {
                    addTreasure(x, y);
                }
            }
        }

        // Track grid dimensions separately for asymmetric expansion
        const gridDimensions = {
            width: MIN_GRID_SIZE,   // x dimension
            height: MIN_GRID_SIZE,  // y dimension
        };

        // Expand grid in negative direction (shift everything)
        function expandGridNegative(shiftX, shiftY) {
            if (shiftX > 0) {
                // Shift all cubes in x direction
                const newCubes = [];
                for (let i = 0; i < gridDimensions.width + shiftX; i++) {
                    newCubes[i] = [];
                    for (let j = 0; j < gridDimensions.height; j++) {
                        if (i < shiftX) {
                            newCubes[i][j] = 0;  // New empty space
                        } else {
                            newCubes[i][j] = cubeHeights[i - shiftX]?.[j] ?? 0;
                        }
                    }
                }
                cubeHeights = newCubes;
                gridDimensions.width += shiftX;
                player.x += shiftX;
            }

            if (shiftY > 0) {
                // Shift all cubes in y direction
                for (let i = 0; i < gridDimensions.width; i++) {
                    const newRow = [];
                    for (let j = 0; j < gridDimensions.height + shiftY; j++) {
                        if (j < shiftY) {
                            newRow[j] = 0;  // New empty space
                        } else {
                            newRow[j] = cubeHeights[i]?.[j - shiftY] ?? 0;
                        }
                    }
                    cubeHeights[i] = newRow;
                }
                gridDimensions.height += shiftY;
                player.y += shiftY;
            }
        }

        // Expand grid to include a position (grows in 5-tile strips, any direction)
        function expandGridToFit(x, y) {
            let expanded = false;

            // Expand in negative x direction (shift grid right)
            if (x < 0) {
                const shiftX = Math.ceil(-x / GRID_INCREMENT) * GRID_INCREMENT;
                expandGridNegative(shiftX, 0);
                expanded = true;
            }

            // Expand in negative y direction (shift grid down)
            if (y < 0) {
                const shiftY = Math.ceil(-y / GRID_INCREMENT) * GRID_INCREMENT;
                expandGridNegative(0, shiftY);
                expanded = true;
            }

            // Expand width (x) if needed (positive direction)
            while (x >= gridDimensions.width) {
                gridDimensions.width += GRID_INCREMENT;
                expanded = true;
            }

            // Expand height (y) if needed (positive direction)
            while (y >= gridDimensions.height) {
                gridDimensions.height += GRID_INCREMENT;
                expanded = true;
            }

            // Update gameState.gridSize to max dimension (for zoom calculation)
            gameState.gridSize = Math.max(gridDimensions.width, gridDimensions.height);

            if (expanded) {
                // Ensure cubeHeights array covers new dimensions
                for (let i = 0; i < gridDimensions.width; i++) {
                    if (!cubeHeights[i]) cubeHeights[i] = [];
                    for (let j = 0; j < gridDimensions.height; j++) {
                        if (cubeHeights[i][j] === undefined) {
                            cubeHeights[i][j] = 0;
                        }
                    }
                }
                updateZoomAndCamera();
            }

            return expanded;
        }

        // Player state
        const player = {
            x: 5,
            y: 5,
            facing: { x: -1, y: -1 }, // Facing "into screen"
        };

        // Skill system
        const skills = {
            1: { name: "Build", action: "build" },
            2: { name: "Clear", action: "clear" },
            3: { name: "Fly", action: "fly" },
            4: { name: "Dig", action: "dig" },
        };
        let currentSkill = 1;

        // Treasure system
        const treasures = new Set();  // Stores "x,y" strings
        let housesCollected = 0;

        function addTreasure(x, y) {
            treasures.add(`${x},${y}`);
        }

        function hasTreasure(x, y) {
            return treasures.has(`${x},${y}`);
        }

        function removeTreasure(x, y) {
            treasures.delete(`${x},${y}`);
        }

        // Build a special treasure house (golden castle-like structure)
        function buildTreasureHouse(x, y) {
            // Mark this as a treasure house location for special rendering
            if (!window.treasureHouses) window.treasureHouses = new Set();

            const size = 5;
            const baseHeight = 2;
            const towerHeight = 5;

            // Build base platform
            for (let dx = 0; dx < size; dx++) {
                for (let dy = 0; dy < size; dy++) {
                    const gx = x + dx;
                    const gy = y + dy;
                    if (gx < 0 || gy < 0) continue;
                    expandGridToFit(gx, gy);
                    cubeHeights[gx][gy] = Math.max(cubeHeights[gx][gy], baseHeight);
                    window.treasureHouses.add(`${gx},${gy}`);
                }
            }

            // Build corner towers
            const towers = [[0, 0], [0, size-1], [size-1, 0], [size-1, size-1]];
            for (const [dx, dy] of towers) {
                const gx = x + dx;
                const gy = y + dy;
                if (gx < 0 || gy < 0) continue;
                cubeHeights[gx][gy] = Math.max(cubeHeights[gx][gy], towerHeight);
            }

            // Build center spire
            const cx = x + Math.floor(size / 2);
            const cy = y + Math.floor(size / 2);
            if (cx >= 0 && cy >= 0) {
                expandGridToFit(cx, cy);
                cubeHeights[cx][cy] = Math.max(cubeHeights[cx][cy], towerHeight + 2);
            }

            // Build entrance ramp
            for (let i = 1; i <= baseHeight; i++) {
                const gx = x + Math.floor(size / 2);
                const gy = y + size - 1 + i;
                if (gx >= 0 && gy >= 0) {
                    expandGridToFit(gx, gy);
                    cubeHeights[gx][gy] = Math.max(cubeHeights[gx][gy], baseHeight - i + 1);
                    window.treasureHouses.add(`${gx},${gy}`);
                }
            }
        }

        // Spawn initial treasures
        function spawnTreasures(count = 5) {
            for (let i = 0; i < count; i++) {
                const x = Math.floor(Math.random() * gridDimensions.width);
                const y = Math.floor(Math.random() * gridDimensions.height);
                // Don't spawn on player or existing structures
                if ((x === player.x && y === player.y) || cubeHeights[x]?.[y] > 0) continue;
                addTreasure(x, y);
            }
        }

        // Initial treasure spawn
        spawnTreasures(5);

        // Train system
        const trainSystem = {
            track: [],           // Array of {x, y} positions forming the loop
            trackSet: new Set(), // For quick lookup "x,y"
            stations: [],        // Array of {x, y, trackIndex} for stations
            train: {
                trackIndex: 0,   // Current position on track
                speed: 0.1,      // Track positions per frame
                progress: 0,     // Progress to next track position (0-1)
                stopped: false,  // Whether stopped at station
                stopTimer: 0,    // Countdown for station stop
                cars: 3,         // Number of train cars
            },
            playerOnTrain: false,
            playerBoardedAt: -1, // Track index where player boarded
        };

        // Generate track around city perimeter
        function generateTrack(citySize) {
            trainSystem.track = [];
            trainSystem.trackSet.clear();
            trainSystem.stations = [];

            const margin = 5;  // Distance from edge
            const trackPath = [];

            // Create rectangular track around city
            // Bottom edge (left to right)
            for (let x = margin; x < citySize - margin; x++) {
                trackPath.push({ x, y: citySize - margin });
            }
            // Right edge (bottom to top)
            for (let y = citySize - margin; y > margin; y--) {
                trackPath.push({ x: citySize - margin, y });
            }
            // Top edge (right to left)
            for (let x = citySize - margin; x > margin; x--) {
                trackPath.push({ x, y: margin });
            }
            // Left edge (top to bottom)
            for (let y = margin; y < citySize - margin; y++) {
                trackPath.push({ x: margin, y });
            }

            // Store track
            trainSystem.track = trackPath;
            for (const pos of trackPath) {
                trainSystem.trackSet.add(`${pos.x},${pos.y}`);
            }

            // Clear track area (remove buildings on track)
            for (const pos of trackPath) {
                if (cubeHeights[pos.x] && cubeHeights[pos.x][pos.y] !== undefined) {
                    cubeHeights[pos.x][pos.y] = 0;
                }
                // Also clear adjacent tiles for track width
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        const nx = pos.x + dx;
                        const ny = pos.y + dy;
                        if (nx >= 0 && ny >= 0 && nx < citySize && ny < citySize) {
                            if (cubeHeights[nx] && cubeHeights[nx][ny] !== undefined) {
                                cubeHeights[nx][ny] = 0;
                            }
                        }
                    }
                }
            }

            // Add stations at corners and midpoints
            const stationIndices = [
                0,                                          // Bottom-left corner
                Math.floor(trackPath.length * 0.125),       // Bottom middle
                Math.floor(trackPath.length * 0.25),        // Bottom-right corner
                Math.floor(trackPath.length * 0.375),       // Right middle
                Math.floor(trackPath.length * 0.5),         // Top-right corner
                Math.floor(trackPath.length * 0.625),       // Top middle
                Math.floor(trackPath.length * 0.75),        // Top-left corner
                Math.floor(trackPath.length * 0.875),       // Left middle
            ];

            for (const idx of stationIndices) {
                const pos = trackPath[idx];
                trainSystem.stations.push({
                    x: pos.x,
                    y: pos.y,
                    trackIndex: idx,
                });
            }

            // Reset train position
            trainSystem.train.trackIndex = 0;
            trainSystem.train.progress = 0;
            trainSystem.train.stopped = false;
            trainSystem.train.stopTimer = 0;
            trainSystem.playerOnTrain = false;
        }

        // Check if position is a track tile
        function isTrack(x, y) {
            return trainSystem.trackSet.has(`${x},${y}`);
        }

        // Check if position is a station
        function getStationAt(x, y) {
            return trainSystem.stations.find(s => s.x === x && s.y === y);
        }

        // Get train's current world position (interpolated)
        function getTrainPosition() {
            const track = trainSystem.track;
            if (track.length === 0) return null;

            const currentIdx = trainSystem.train.trackIndex;
            const nextIdx = (currentIdx + 1) % track.length;
            const progress = trainSystem.train.progress;

            const current = track[currentIdx];
            const next = track[nextIdx];

            return {
                x: current.x + (next.x - current.x) * progress,
                y: current.y + (next.y - current.y) * progress,
            };
        }

        // Update train position
        function updateTrain() {
            const train = trainSystem.train;
            const track = trainSystem.track;
            if (track.length === 0) return;

            // Check if stopped at station
            if (train.stopped) {
                train.stopTimer -= 1/60;  // Assuming 60fps
                if (train.stopTimer <= 0) {
                    train.stopped = false;
                }
                return;
            }

            // Move train
            train.progress += train.speed;

            while (train.progress >= 1) {
                train.progress -= 1;
                train.trackIndex = (train.trackIndex + 1) % track.length;

                // Check if arrived at station
                const currentPos = track[train.trackIndex];
                const station = getStationAt(currentPos.x, currentPos.y);
                if (station) {
                    train.stopped = true;
                    train.stopTimer = 2;  // Stop for 2 seconds
                }
            }

            // Update player position if on train
            if (trainSystem.playerOnTrain) {
                const pos = getTrainPosition();
                if (pos) {
                    player.x = Math.round(pos.x);
                    player.y = Math.round(pos.y);
                }
            }
        }

        // Board or exit train
        function toggleTrainBoarding() {
            const train = trainSystem.train;
            const track = trainSystem.track;
            if (track.length === 0) return false;

            if (trainSystem.playerOnTrain) {
                // Exit train - only at stations when stopped
                if (train.stopped) {
                    trainSystem.playerOnTrain = false;
                    // Move player off the track
                    const pos = track[train.trackIndex];
                    player.x = pos.x + 1;
                    player.y = pos.y + 1;
                    return true;
                }
                return false;
            } else {
                // Board train - must be at station and train stopped there
                const station = getStationAt(player.x, player.y);
                if (station && train.stopped) {
                    const currentPos = track[train.trackIndex];
                    if (currentPos.x === station.x && currentPos.y === station.y) {
                        trainSystem.playerOnTrain = true;
                        trainSystem.playerBoardedAt = train.trackIndex;
                        return true;
                    }
                }
                // Also allow boarding if adjacent to station
                for (const station of trainSystem.stations) {
                    const dx = Math.abs(player.x - station.x);
                    const dy = Math.abs(player.y - station.y);
                    if (dx <= 1 && dy <= 1 && train.stopped) {
                        const currentPos = track[train.trackIndex];
                        if (currentPos.x === station.x && currentPos.y === station.y) {
                            trainSystem.playerOnTrain = true;
                            trainSystem.playerBoardedAt = train.trackIndex;
                            player.x = station.x;
                            player.y = station.y;
                            return true;
                        }
                    }
                }
                return false;
            }
        }

        // Update camera to follow player (when scrolling)
        function updateCamera() {
            if (!gameState.scrolling) return;

            const playerScreen = gridToScreenWorld(player.x, player.y, getHeight(player.x, player.y));

            // Center camera on player
            const targetCamX = playerScreen.x - CANVAS_WIDTH / 2;
            const targetCamY = playerScreen.y - CANVAS_HEIGHT / 2;

            // Snap camera to player (no lag)
            gameState.cameraX = targetCamX;
            gameState.cameraY = targetCamY;
        }

        // Initialize
        updateZoomAndCamera();

        // 8-way direction mappings using QWEASDZXC layout
        // Screen directions map to world coords:
        //   Q W E       (-1,0) (-1,-1) (0,-1)
        //   A   D   →   (-1,+1)        (+1,-1)
        //   Z X C       (0,+1) (+1,+1) (+1,0)
        const directions = {
            // QWEASDZXC - 8 directions
            q: { x: -1, y:  0 },  // screen up-left = world -X
            w: { x: -1, y: -1 },  // screen up = into screen
            e: { x:  0, y: -1 },  // screen up-right = world -Y
            a: { x: -1, y:  1 },  // screen left
            d: { x:  1, y: -1 },  // screen right
            z: { x:  0, y:  1 },  // screen down-left = world +Y
            x: { x:  1, y:  1 },  // screen down = toward camera
            c: { x:  1, y:  0 },  // screen down-right = world +X
            // Arrow keys (same as WADX)
            up:    { x: -1, y: -1 },
            down:  { x:  1, y:  1 },
            left:  { x: -1, y:  1 },
            right: { x:  1, y: -1 },
        };

        // Movement timing
        const HOLD_THRESHOLD = 300;  // ms before movement starts (longer for kids)
        const MOVE_INTERVAL = 120;   // ms between moves while holding
        const keyState = {};

        // Convert grid coords to world coords (before camera transform)
        function gridToScreenWorld(gx, gy, gz = 0) {
            const tw = getTileWidth();
            const th = getTileHeight();
            const ch = getCubeHeight();
            // Center the grid in the view
            const offsetX = CANVAS_WIDTH / 2;
            const offsetY = CANVAS_HEIGHT / 2 - (gameState.gridSize * th / 2);

            const sx = (gx - gy) * (tw / 2) + offsetX;
            const sy = (gx + gy) * (th / 2) - gz * ch + offsetY;
            return { x: sx, y: sy };
        }

        // Convert grid coords to screen coords (with camera)
        function gridToScreen(gx, gy, gz = 0) {
            const world = gridToScreenWorld(gx, gy, gz);
            return {
                x: world.x - gameState.cameraX,
                y: world.y - gameState.cameraY
            };
        }

        // Check if position is valid (can expand grid in any direction)
        function isValidPosition(x, y, allowExpand = false) {
            // If outside current bounds
            if (x < 0 || y < 0 || x >= gridDimensions.width || y >= gridDimensions.height) {
                if (allowExpand) {
                    expandGridToFit(x, y);
                    return true;  // After expansion, position is valid
                }
                return false;
            }
            return true;
        }

        // Get height at position
        function getHeight(x, y) {
            if (!isValidPosition(x, y)) return 999;
            return cubeHeights[x][y];
        }

        // Get player's current height
        function getPlayerHeight() {
            return getHeight(player.x, player.y);
        }

        // Draw isometric diamond (ground tile)
        function drawTile(gx, gy, color, outlineColor) {
            const pos = gridToScreen(gx, gy, 0);
            const hw = getTileWidth() / 2;
            const hh = getTileHeight() / 2;

            k.drawPolygon({
                pts: [
                    k.vec2(0, -hh),
                    k.vec2(hw, 0),
                    k.vec2(0, hh),
                    k.vec2(-hw, 0),
                ],
                pos: k.vec2(pos.x, pos.y),
                fill: true,
                color: k.Color.fromArray(color),
                outline: { width: 1, color: k.Color.fromArray(outlineColor) },
            });
        }

        // Draw isometric cube with opacity (0-1)
        function drawCube(gx, gy, gz, colors, opacity = 1) {
            const pos = gridToScreen(gx, gy, gz + 1);
            const hw = getTileWidth() / 2;
            const hh = getTileHeight() / 2;
            const ch = getCubeHeight();

            k.drawPolygon({
                pts: [k.vec2(-hw, 0), k.vec2(0, hh), k.vec2(0, hh + ch), k.vec2(-hw, ch)],
                pos: k.vec2(pos.x, pos.y),
                fill: true,
                color: k.Color.fromArray(colors.left),
                opacity: opacity,
            });
            k.drawPolygon({
                pts: [k.vec2(hw, 0), k.vec2(0, hh), k.vec2(0, hh + ch), k.vec2(hw, ch)],
                pos: k.vec2(pos.x, pos.y),
                fill: true,
                color: k.Color.fromArray(colors.right),
                opacity: opacity,
            });
            k.drawPolygon({
                pts: [k.vec2(0, -hh), k.vec2(hw, 0), k.vec2(0, hh), k.vec2(-hw, 0)],
                pos: k.vec2(pos.x, pos.y),
                fill: true,
                color: k.Color.fromArray(colors.top),
                opacity: opacity,
            });
        }

        // Detection settings
        const BASE_SCREEN_RADIUS = 80;   // pixels at zoom 1.0
        const MIN_OPACITY = 0.2;    // 80% transparent at center
        const MAX_OPACITY = 0.8;    // 20% transparent at edge

        function getScreenRadius() { return BASE_SCREEN_RADIUS * gameState.zoom; }

        // Calculate opacity based on screen distance from player
        // Only affects cubes IN FRONT of player (blocking the view)
        // Returns 1.0 if behind player or outside radius
        function getOpacityForCube(cx, cy, cz, px, py, pz) {
            // Check if cube is in front of player (closer to camera)
            // Only use x+y for depth check, not height - height doesn't affect occlusion
            const cubeDepth = cx + cy;
            const playerDepth = px + py;

            // If cube is behind or at same depth as player, keep it fully opaque
            if (cubeDepth <= playerDepth) {
                return 1.0;
            }

            // Check screen distance
            const cubeScreen = gridToScreen(cx, cy, cz);
            const playerScreen = gridToScreen(px, py, pz);
            const dx = cubeScreen.x - playerScreen.x;
            const dy = cubeScreen.y - playerScreen.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            const radius = getScreenRadius();
            if (dist >= radius) {
                return 1.0;  // Fully opaque outside radius
            }

            // Lerp from MIN_OPACITY (at center) to MAX_OPACITY (at edge)
            const t = dist / radius;
            return MIN_OPACITY + t * (MAX_OPACITY - MIN_OPACITY);
        }

        // Draw the player (circle with direction indicator)
        function drawPlayer() {
            const height = getPlayerHeight();
            const pos = gridToScreen(player.x, player.y, height);
            const z = gameState.zoom;

            // Player shadow
            k.drawEllipse({
                pos: k.vec2(pos.x, pos.y + 4 * z),
                radiusX: 14 * z,
                radiusY: 8 * z,
                color: k.Color.fromArray([0, 0, 0, 0.3]),
            });

            // Player body (circle rendered as ellipse for isometric)
            k.drawEllipse({
                pos: k.vec2(pos.x, pos.y - 10 * z),
                radiusX: 16 * z,
                radiusY: 16 * z,
                color: k.Color.fromArray([255, 100, 100]),
                outline: { width: 2 * z, color: k.Color.fromArray([200, 50, 50]) },
            });

            // Direction indicator
            const facingPos = gridToScreen(
                player.x + player.facing.x * 0.5,
                player.y + player.facing.y * 0.5,
                height
            );

            k.drawCircle({
                pos: k.vec2(facingPos.x, facingPos.y - 10 * z),
                radius: 6 * z,
                color: k.Color.fromArray([255, 255, 100]),
                outline: { width: 1 * z, color: k.Color.fromArray([200, 200, 50]) },
            });
        }

        // Draw train track tile
        function drawTrackTile(gx, gy) {
            const pos = gridToScreen(gx, gy, 0);
            const hw = getTileWidth() / 2;
            const hh = getTileHeight() / 2;
            const z = gameState.zoom;

            // Track base (darker than ground)
            k.drawPolygon({
                pts: [
                    k.vec2(0, -hh),
                    k.vec2(hw, 0),
                    k.vec2(0, hh),
                    k.vec2(-hw, 0),
                ],
                pos: k.vec2(pos.x, pos.y),
                fill: true,
                color: k.Color.fromArray([50, 45, 40]),
                outline: { width: 1, color: k.Color.fromArray([70, 65, 60]) },
            });

            // Rail lines
            k.drawLine({
                p1: k.vec2(pos.x - hw * 0.3, pos.y - hh * 0.3),
                p2: k.vec2(pos.x + hw * 0.3, pos.y + hh * 0.3),
                width: 2 * z,
                color: k.Color.fromArray([120, 120, 130]),
            });
            k.drawLine({
                p1: k.vec2(pos.x - hw * 0.5, pos.y + hh * 0.1),
                p2: k.vec2(pos.x + hw * 0.1, pos.y - hh * 0.5),
                width: 2 * z,
                color: k.Color.fromArray([120, 120, 130]),
            });
        }

        // Draw station
        function drawStation(gx, gy) {
            const pos = gridToScreen(gx, gy, 0);
            const z = gameState.zoom;

            // Platform (raised yellow area)
            k.drawEllipse({
                pos: k.vec2(pos.x, pos.y),
                radiusX: 20 * z,
                radiusY: 12 * z,
                color: k.Color.fromArray([180, 160, 60]),
                outline: { width: 2 * z, color: k.Color.fromArray([140, 120, 40]) },
            });

            // Station sign
            k.drawRect({
                pos: k.vec2(pos.x - 8 * z, pos.y - 25 * z),
                width: 16 * z,
                height: 12 * z,
                color: k.Color.fromArray([200, 50, 50]),
                outline: { width: 1 * z, color: k.Color.fromArray([150, 30, 30]) },
            });

            // Sign post
            k.drawRect({
                pos: k.vec2(pos.x - 1 * z, pos.y - 13 * z),
                width: 2 * z,
                height: 15 * z,
                color: k.Color.fromArray([80, 80, 80]),
            });
        }

        // Draw train
        function drawTrain() {
            const pos = getTrainPosition();
            if (!pos) return;

            const screenPos = gridToScreen(pos.x, pos.y, 0);
            const z = gameState.zoom;
            const train = trainSystem.train;

            // Draw train cars (locomotive + cars behind)
            for (let car = 0; car < train.cars; car++) {
                // Calculate position for this car (behind the locomotive)
                const carOffset = car * 8;  // Track positions behind
                let carTrackIdx = train.trackIndex - carOffset;
                if (carTrackIdx < 0) carTrackIdx += trainSystem.track.length;

                const carTrackPos = trainSystem.track[carTrackIdx];
                if (!carTrackPos) continue;

                const carScreenPos = gridToScreen(carTrackPos.x, carTrackPos.y, 0);

                if (car === 0) {
                    // Locomotive (red)
                    k.drawEllipse({
                        pos: k.vec2(carScreenPos.x, carScreenPos.y - 8 * z),
                        radiusX: 14 * z,
                        radiusY: 10 * z,
                        color: k.Color.fromArray([200, 50, 50]),
                        outline: { width: 2 * z, color: k.Color.fromArray([150, 30, 30]) },
                    });
                    // Chimney
                    k.drawRect({
                        pos: k.vec2(carScreenPos.x - 3 * z, carScreenPos.y - 22 * z),
                        width: 6 * z,
                        height: 8 * z,
                        color: k.Color.fromArray([60, 60, 60]),
                    });
                    // Smoke puff
                    if (!train.stopped) {
                        const smokeOffset = (Date.now() / 100) % 10;
                        k.drawCircle({
                            pos: k.vec2(carScreenPos.x, carScreenPos.y - 28 * z - smokeOffset * z),
                            radius: (4 + smokeOffset * 0.5) * z,
                            color: k.Color.fromArray([200, 200, 200, 0.6]),
                        });
                    }
                } else {
                    // Passenger cars (blue)
                    k.drawEllipse({
                        pos: k.vec2(carScreenPos.x, carScreenPos.y - 6 * z),
                        radiusX: 12 * z,
                        radiusY: 8 * z,
                        color: k.Color.fromArray([60, 100, 180]),
                        outline: { width: 2 * z, color: k.Color.fromArray([40, 70, 140]) },
                    });
                    // Windows
                    k.drawRect({
                        pos: k.vec2(carScreenPos.x - 6 * z, carScreenPos.y - 9 * z),
                        width: 4 * z,
                        height: 3 * z,
                        color: k.Color.fromArray([200, 220, 255]),
                    });
                    k.drawRect({
                        pos: k.vec2(carScreenPos.x + 2 * z, carScreenPos.y - 9 * z),
                        width: 4 * z,
                        height: 3 * z,
                        color: k.Color.fromArray([200, 220, 255]),
                    });
                }
            }

            // Show "STOPPED" indicator when at station
            if (train.stopped) {
                k.drawText({
                    text: "STOP",
                    pos: k.vec2(screenPos.x - 15 * z, screenPos.y - 40 * z),
                    size: 10 * z,
                    color: k.Color.fromArray([255, 255, 100]),
                });
            }
        }

        // Draw treasure X mark
        function drawTreasureX(gx, gy) {
            const height = getHeight(gx, gy);
            const pos = gridToScreen(gx, gy, height);
            const z = gameState.zoom;
            const size = 12 * z;

            // Draw golden X
            k.drawLine({
                p1: k.vec2(pos.x - size, pos.y - size),
                p2: k.vec2(pos.x + size, pos.y + size),
                width: 4 * z,
                color: k.Color.fromArray([255, 215, 0]),
            });
            k.drawLine({
                p1: k.vec2(pos.x + size, pos.y - size),
                p2: k.vec2(pos.x - size, pos.y + size),
                width: 4 * z,
                color: k.Color.fromArray([255, 215, 0]),
            });
            // Outline for visibility
            k.drawLine({
                p1: k.vec2(pos.x - size, pos.y - size),
                p2: k.vec2(pos.x + size, pos.y + size),
                width: 6 * z,
                color: k.Color.fromArray([139, 69, 19]),
            });
            k.drawLine({
                p1: k.vec2(pos.x + size, pos.y - size),
                p2: k.vec2(pos.x - size, pos.y + size),
                width: 6 * z,
                color: k.Color.fromArray([139, 69, 19]),
            });
            // Inner gold
            k.drawLine({
                p1: k.vec2(pos.x - size, pos.y - size),
                p2: k.vec2(pos.x + size, pos.y + size),
                width: 3 * z,
                color: k.Color.fromArray([255, 215, 0]),
            });
            k.drawLine({
                p1: k.vec2(pos.x + size, pos.y - size),
                p2: k.vec2(pos.x - size, pos.y + size),
                width: 3 * z,
                color: k.Color.fromArray([255, 215, 0]),
            });
        }

        // Draw highlight on tile player is facing
        function drawFacingHighlight() {
            const targetX = player.x + player.facing.x;
            const targetY = player.y + player.facing.y;

            if (!isValidPosition(targetX, targetY)) return;

            const height = getHeight(targetX, targetY);
            const pos = gridToScreen(targetX, targetY, height);
            const hw = getTileWidth() / 2;
            const hh = getTileHeight() / 2;

            k.drawPolygon({
                pts: [
                    k.vec2(0, -hh),
                    k.vec2(hw, 0),
                    k.vec2(0, hh),
                    k.vec2(-hw, 0),
                ],
                pos: k.vec2(pos.x, pos.y),
                fill: true,
                color: k.Color.fromArray([255, 255, 100, 0.4]),
                outline: { width: 2 * gameState.zoom, color: k.Color.fromArray([255, 255, 100]) },
            });
        }

        // Cube colors based on height and type
        function getCubeColors(height, x, y) {
            // Check if this is a treasure house
            if (window.treasureHouses && window.treasureHouses.has(`${x},${y}`)) {
                // Golden/royal colors for treasure houses
                const goldColors = [
                    { top: [255, 215, 0], left: [184, 134, 11], right: [218, 165, 32] },   // Gold
                    { top: [255, 223, 100], left: [200, 150, 30], right: [230, 180, 50] }, // Light gold
                    { top: [238, 201, 0], left: [170, 120, 0], right: [200, 160, 20] },    // Deep gold
                    { top: [255, 230, 130], left: [190, 140, 40], right: [220, 175, 60] }, // Pale gold
                    { top: [212, 175, 55], left: [150, 110, 20], right: [180, 140, 40] },  // Antique gold
                ];
                return goldColors[height % goldColors.length];
            }

            // Simple hue-based coloring for normal cubes
            const baseColors = [
                { top: [120, 180, 120], left: [80, 140, 80], right: [100, 160, 100] },
                { top: [180, 140, 100], left: [140, 100, 60], right: [160, 120, 80] },
                { top: [100, 140, 180], left: [60, 100, 140], right: [80, 120, 160] },
                { top: [180, 120, 160], left: [140, 80, 120], right: [160, 100, 140] },
                { top: [160, 160, 100], left: [120, 120, 60], right: [140, 140, 80] },
            ];
            return baseColors[height % baseColors.length];
        }

        // Main game scene
        k.scene("game", () => {
            // Handle movement (facing is set separately on key press)
            function tryMove(dir) {
                const newX = player.x + dir.x;
                const newY = player.y + dir.y;

                // Allow expansion when moving to positive coordinates
                if (!isValidPosition(newX, newY, true)) return;

                const currentHeight = getPlayerHeight();
                const targetHeight = getHeight(newX, newY);

                // In fly mode, can move regardless of height difference
                // Otherwise, can only move if height difference is <= 1
                if (currentSkill === 3 || targetHeight <= currentHeight + 1) {
                    player.x = newX;
                    player.y = newY;
                }
            }

            // Use current skill
            function useSkill() {
                const targetX = player.x + player.facing.x;
                const targetY = player.y + player.facing.y;

                // Allow expansion when building
                if (!isValidPosition(targetX, targetY, currentSkill === 1)) return;

                const action = skills[currentSkill].action;

                if (action === "build") {
                    // Add one cube
                    cubeHeights[targetX][targetY]++;
                } else if (action === "clear") {
                    // Remove one cube (if any)
                    if (cubeHeights[targetX][targetY] > 0) {
                        cubeHeights[targetX][targetY]--;
                    }
                } else if (action === "fly") {
                    // Teleport to target position
                    player.x = targetX;
                    player.y = targetY;
                } else if (action === "dig") {
                    // Dig down (can go negative)
                    cubeHeights[targetX][targetY]--;

                    // Check if we found buried treasure (at depth -2)
                    if (hasTreasure(targetX, targetY) && cubeHeights[targetX][targetY] <= -2) {
                        removeTreasure(targetX, targetY);
                        housesCollected++;
                        // Build treasure house nearby
                        buildTreasureHouse(targetX + 3, targetY + 3);
                    }
                }
            }

            // Tap-to-face, hold-to-move handler
            // If already facing this direction, tap moves one step
            function setupDirectionKey(key, dir) {
                k.onKeyPress(key, () => {
                    const alreadyFacing = player.facing.x === dir.x && player.facing.y === dir.y;

                    if (alreadyFacing) {
                        // Already facing this way - move one step
                        tryMove(dir);
                    } else {
                        // Face this direction
                        player.facing = { x: dir.x, y: dir.y };
                    }

                    keyState[key] = {
                        pressTime: Date.now(),
                        lastMove: alreadyFacing ? Date.now() : 0,
                    };
                });

                k.onKeyRelease(key, () => {
                    delete keyState[key];
                });
            }

            // Setup all direction keys
            const dirKeys = ["q", "w", "e", "a", "d", "z", "x", "c", "up", "down", "left", "right"];
            for (const key of dirKeys) {
                setupDirectionKey(key, directions[key]);
            }

            // Check for held keys and move
            k.onUpdate(() => {
                const now = Date.now();
                for (const key of dirKeys) {
                    if (keyState[key]) {
                        const state = keyState[key];
                        const holdTime = now - state.pressTime;

                        // Only move if held past threshold
                        if (holdTime >= HOLD_THRESHOLD) {
                            // Check if enough time passed since last move
                            if (now - state.lastMove >= MOVE_INTERVAL) {
                                tryMove(directions[key]);
                                state.lastMove = now;
                            }
                        }
                    }
                }
            });

            k.onKeyPress("space", () => useSkill());

            // Skill selection keys
            k.onKeyPress("1", () => { currentSkill = 1; });
            k.onKeyPress("2", () => { currentSkill = 2; });
            k.onKeyPress("3", () => { currentSkill = 3; });
            k.onKeyPress("4", () => { currentSkill = 4; });

            // Update camera and train each frame
            k.onUpdate(() => {
                updateCamera();
                updateTrain();
            });

            // Train boarding key
            k.onKeyPress("t", () => {
                toggleTrainBoarding();
            });

            // Render loop
            k.onDraw(() => {
                // Collect all drawable items with their sort keys
                const drawables = [];
                const gw = gridDimensions.width;
                const gh = gridDimensions.height;

                // Calculate visible tile range (frustum culling)
                // In isometric: screen_x = (gx - gy) * tw/2, screen_y = (gx + gy) * th/2
                // We need to find which gx, gy values produce screen coords in view
                const tw = getTileWidth();
                const th = getTileHeight();
                const margin = 100;

                // Approximate visible range based on player position and screen size
                const visibleRadius = Math.ceil((CANVAS_WIDTH + CANVAS_HEIGHT) / Math.min(tw, th)) + 5;
                const minX = Math.max(0, player.x - visibleRadius);
                const maxX = Math.min(gw, player.x + visibleRadius);
                const minY = Math.max(0, player.y - visibleRadius);
                const maxY = Math.min(gh, player.y + visibleRadius);

                // Visibility check for edge cases
                function isVisible(gx, gy, gz = 0) {
                    const pos = gridToScreen(gx, gy, gz);
                    return pos.x >= -margin && pos.x <= CANVAS_WIDTH + margin &&
                           pos.y >= -margin && pos.y <= CANVAS_HEIGHT + margin;
                }

                // Add ground tiles (only in visible range)
                for (let x = minX; x < maxX; x++) {
                    for (let y = minY; y < maxY; y++) {
                        const h = cubeHeights[x]?.[y] ?? 0;
                        if (h < 0) {
                            // This is a pit - draw pit floor at the bottom
                            if (!isVisible(x, y, h)) continue;
                            drawables.push({
                                type: "pit",
                                x, y, z: h,
                                sortKey: x + y + h * 0.1,
                            });
                        } else if (isTrack(x, y)) {
                            // Track tile
                            if (!isVisible(x, y, 0)) continue;
                            drawables.push({
                                type: "track",
                                x, y, z: 0,
                                sortKey: x + y,
                            });
                        } else {
                            // Normal ground tile
                            if (!isVisible(x, y, 0)) continue;
                            drawables.push({
                                type: "tile",
                                x, y, z: 0,
                                sortKey: x + y,
                            });
                        }
                    }
                }

                // Add stations
                for (const station of trainSystem.stations) {
                    if (!isVisible(station.x, station.y, 0)) continue;
                    drawables.push({
                        type: "station",
                        x: station.x,
                        y: station.y,
                        z: 0,
                        sortKey: station.x + station.y + 0.01,
                    });
                }

                // Add cubes (only in visible range)
                for (let x = minX; x < maxX; x++) {
                    for (let y = minY; y < maxY; y++) {
                        const height = cubeHeights[x]?.[y] ?? 0;
                        if (height === 0) continue;
                        if (!isVisible(x, y, 0) && !isVisible(x, y, height)) continue;
                        for (let z = 0; z < height; z++) {
                            drawables.push({
                                type: "cube",
                                x, y, z,
                                sortKey: x + y + z * 0.1,
                            });
                        }
                    }
                }

                // Add treasures
                for (const key of treasures) {
                    const [tx, ty] = key.split(',').map(Number);
                    if (tx < minX || tx >= maxX || ty < minY || ty >= maxY) continue;
                    const th = cubeHeights[tx]?.[ty] ?? 0;
                    if (!isVisible(tx, ty, th)) continue;
                    drawables.push({
                        type: "treasure",
                        x: tx,
                        y: ty,
                        z: th,
                        sortKey: tx + ty + th * 0.1 + 0.02,  // Draw just above tiles/cubes
                    });
                }

                // Add player
                const playerHeight = getPlayerHeight();
                drawables.push({
                    type: "player",
                    x: player.x,
                    y: player.y,
                    z: playerHeight,
                    sortKey: player.x + player.y + playerHeight * 0.1 + 0.05,
                });

                // Sort by depth
                drawables.sort((a, b) => a.sortKey - b.sortKey);

                // Draw facing highlight first (below everything at that position)
                drawFacingHighlight();

                // Draw everything
                for (const item of drawables) {
                    if (item.type === "tile") {
                        const isEven = (item.x + item.y) % 2 === 0;
                        drawTile(
                            item.x, item.y,
                            isEven ? [70, 90, 70] : [60, 80, 60],
                            [50, 70, 50]
                        );
                    } else if (item.type === "track") {
                        drawTrackTile(item.x, item.y);
                    } else if (item.type === "station") {
                        drawStation(item.x, item.y);
                    } else if (item.type === "pit") {
                        // Draw pit floor (darker)
                        const pos = gridToScreen(item.x, item.y, item.z);
                        const hw = getTileWidth() / 2;
                        const hh = getTileHeight() / 2;
                        const isEven = (item.x + item.y) % 2 === 0;
                        k.drawPolygon({
                            pts: [
                                k.vec2(0, -hh),
                                k.vec2(hw, 0),
                                k.vec2(0, hh),
                                k.vec2(-hw, 0),
                            ],
                            pos: k.vec2(pos.x, pos.y),
                            fill: true,
                            color: k.Color.fromArray(isEven ? [40, 50, 55] : [35, 45, 50]),
                            outline: { width: 1, color: k.Color.fromArray([30, 40, 45]) },
                        });
                        // Draw pit walls
                        const ch = getCubeHeight();
                        const depth = -item.z;
                        // Left wall (visible from right side)
                        k.drawPolygon({
                            pts: [
                                k.vec2(-hw, 0),
                                k.vec2(0, hh),
                                k.vec2(0, hh - depth * ch),
                                k.vec2(-hw, -depth * ch),
                            ],
                            pos: k.vec2(pos.x, pos.y),
                            fill: true,
                            color: k.Color.fromArray([50, 60, 65]),
                        });
                        // Right wall (visible from left side)
                        k.drawPolygon({
                            pts: [
                                k.vec2(hw, 0),
                                k.vec2(0, hh),
                                k.vec2(0, hh - depth * ch),
                                k.vec2(hw, -depth * ch),
                            ],
                            pos: k.vec2(pos.x, pos.y),
                            fill: true,
                            color: k.Color.fromArray([45, 55, 60]),
                        });
                    } else if (item.type === "cube") {
                        // Get opacity based on distance from player (gradient transparency)
                        const opacity = getOpacityForCube(
                            item.x, item.y, item.z,
                            player.x, player.y, playerHeight
                        );
                        drawCube(item.x, item.y, item.z, getCubeColors(item.z, item.x, item.y), opacity);
                    } else if (item.type === "treasure") {
                        drawTreasureX(item.x, item.y);
                    } else if (item.type === "player") {
                        drawPlayer();
                    }
                }

                // Draw train on top (always visible)
                if (trainSystem.track.length > 0) {
                    drawTrain();
                }

                // Draw UI
                k.drawText({
                    text: `Cubes: ${cubeHeights.flat().reduce((a, b) => a + b, 0)}  Grid: ${gw}x${gh}`,
                    pos: k.vec2(20, 20),
                    size: 16,
                    color: k.Color.fromArray([200, 200, 200]),
                });

                k.drawText({
                    text: `Height: ${playerHeight}  Zoom: ${Math.round(gameState.zoom * 100)}%  Houses: ${housesCollected}  Treasures: ${treasures.size}`,
                    pos: k.vec2(20, 42),
                    size: 16,
                    color: k.Color.fromArray([200, 200, 200]),
                });

                // Draw skill indicator
                k.drawText({
                    text: `Skill: (1) Build  (2) Clear  (3) Fly  (4) Dig`,
                    pos: k.vec2(20, 64),
                    size: 14,
                    color: k.Color.fromArray([150, 150, 150]),
                });
                k.drawText({
                    text: `Active: ${skills[currentSkill].name}`,
                    pos: k.vec2(20, 82),
                    size: 16,
                    color: k.Color.fromArray([255, 255, 100]),
                });

                // Train status
                if (trainSystem.track.length > 0) {
                    const trainStatus = trainSystem.playerOnTrain ? "ON TRAIN - Press T to exit at station" :
                                       trainSystem.train.stopped ? "Train at station - Press T to board" :
                                       "Wait at station for train";
                    k.drawText({
                        text: trainStatus,
                        pos: k.vec2(20, 100),
                        size: 14,
                        color: trainSystem.playerOnTrain ? k.Color.fromArray([100, 255, 100]) : k.Color.fromArray([150, 150, 150]),
                    });
                }

                // Draw minimap when scrolling
                if (gameState.scrolling) {
                    const mmMaxSize = 120;  // Max minimap dimension
                    const maxDim = Math.max(gw, gh);
                    const mmScale = mmMaxSize / maxDim;
                    const mmWidth = gw * mmScale;
                    const mmHeight = gh * mmScale;
                    const mmX = CANVAS_WIDTH - mmWidth - 10;
                    const mmY = 10;

                    // Minimap background
                    k.drawRect({
                        pos: k.vec2(mmX, mmY),
                        width: mmWidth,
                        height: mmHeight,
                        color: k.Color.fromArray([30, 30, 40, 0.8]),
                        outline: { width: 2, color: k.Color.fromArray([100, 100, 120]) },
                    });

                    // Draw cubes on minimap
                    for (let x = 0; x < gw; x++) {
                        for (let y = 0; y < gh; y++) {
                            const h = cubeHeights[x][y];
                            if (h > 0) {
                                const colors = getCubeColors(h - 1);
                                k.drawRect({
                                    pos: k.vec2(mmX + x * mmScale, mmY + y * mmScale),
                                    width: mmScale,
                                    height: mmScale,
                                    color: k.Color.fromArray(colors.top),
                                });
                            }
                        }
                    }

                    // Draw track on minimap
                    for (const pos of trainSystem.track) {
                        k.drawRect({
                            pos: k.vec2(mmX + pos.x * mmScale, mmY + pos.y * mmScale),
                            width: mmScale,
                            height: mmScale,
                            color: k.Color.fromArray([70, 65, 60]),
                        });
                    }

                    // Draw stations on minimap
                    for (const station of trainSystem.stations) {
                        k.drawCircle({
                            pos: k.vec2(mmX + station.x * mmScale + mmScale/2, mmY + station.y * mmScale + mmScale/2),
                            radius: Math.max(2, mmScale),
                            color: k.Color.fromArray([180, 160, 60]),
                        });
                    }

                    // Draw train on minimap
                    const trainPos = getTrainPosition();
                    if (trainPos) {
                        k.drawCircle({
                            pos: k.vec2(mmX + trainPos.x * mmScale + mmScale/2, mmY + trainPos.y * mmScale + mmScale/2),
                            radius: Math.max(3, mmScale),
                            color: k.Color.fromArray([200, 50, 50]),
                            outline: { width: 1, color: k.Color.fromArray([255, 255, 255]) },
                        });
                    }

                    // Draw player on minimap
                    k.drawCircle({
                        pos: k.vec2(mmX + player.x * mmScale + mmScale/2, mmY + player.y * mmScale + mmScale/2),
                        radius: Math.max(3, mmScale / 2),
                        color: k.Color.fromArray([255, 100, 100]),
                        outline: { width: 1, color: k.Color.fromArray([255, 255, 255]) },
                    });

                    // Draw viewport rectangle on minimap
                    const vpWidth = (CANVAS_WIDTH / getTileWidth()) * mmScale;
                    const vpHeight = (CANVAS_HEIGHT / getTileHeight()) * mmScale;

                    k.drawRect({
                        pos: k.vec2(mmX + gw * mmScale / 2 - vpWidth / 2, mmY + gh * mmScale / 2 - vpHeight / 2),
                        width: vpWidth,
                        height: vpHeight,
                        fill: false,
                        outline: { width: 1, color: k.Color.fromArray([255, 255, 100]) },
                    });
                }
            });
        });

        // Start game
        k.go("game");
    </script>
</body>
</html>
